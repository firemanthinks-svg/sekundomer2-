<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer & Sekundomer</title>
    <link rel="shortcut icon" href="" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />

    <!-- (fontawesome link) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- (end fontawesome link) -->
</head>





<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .box {
        background: #1e293b;
        padding: 25px;
        border-radius: 20px;
        width: 330px;
        text-align: center;
    }

    .tabs button {
        width: 48%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #334155;
        color: white;
        cursor: pointer;
    }

    .active {
        background: #22c55e !important;
    }

    .time {
        font-size: 40px;
        margin: 20px 0;
    }

    input {
        width: 60px;
        padding: 8px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        text-align: center;
    }

    button {
        padding: 10px;
        margin: 5px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .start {
        background: #22c55e;
    }

    .stop {
        background: #ef4444;
    }

    .reset {
        background: #3b82f6;
    }
</style>
</head>

<body>

    <div class="box">

        <div class="tabs">
            <button id="swTab" class="active" onclick="showSW()">Sekundomer</button>
            <button id="tmTab" onclick="showTM()">Timer</button>
        </div>

        <!-- SEKUNDOMER -->
        <div id="stopwatch">
            <div class="time" id="swDisplay">00:00:00</div>

            <button class="start" onclick="startSW()">Start</button>
            <button class="stop" onclick="pauseSW()">Pause</button>
            <button class="reset" onclick="resetSW()">Reset</button>
        </div>

        <!-- TIMER -->
        <div id="timer" style="display:none;">
            <input type="number" id="hour" placeholder="hh" oninput="updateTimer()">
            <input type="number" id="min" placeholder="mm" oninput="updateTimer()">
            <input type="number" id="sec" placeholder="ss" oninput="updateTimer()">

            <div class="time" id="tmDisplay">00:00:00</div>

            <button class="start" onclick="startTM()">Start</button>
            <button class="stop" onclick="pauseTM()">Pause</button>
            <button class="reset" onclick="resetTM()">Reset</button>
        </div>

    </div>

    <script>
        /* ========= SEKUNDOMER ========= */
        let swTime = 0;
        let swInterval = null;

        function renderSW() {
            let h = Math.floor(swTime / 3600);
            let m = Math.floor((swTime % 3600) / 60);
            let s = swTime % 60;

            document.getElementById("swDisplay").innerText =
                String(h).padStart(2, '0') + ":" +
                String(m).padStart(2, '0') + ":" +
                String(s).padStart(2, '0');
        }

        function startSW() {
            if (!swInterval) {
                swInterval = setInterval(() => {
                    swTime++;
                    renderSW();
                }, 1000);
            }
        }

        function pauseSW() {
            clearInterval(swInterval);
            swInterval = null;
        }

        function resetSW() {
            pauseSW();
            swTime = 0;
            renderSW();
        }


        /* ========= TIMER ========= */
        let tmTime = 0;
        let tmInterval = null;

        function renderTM() {
            let h = Math.floor(tmTime / 3600);
            let m = Math.floor((tmTime % 3600) / 60);
            let s = tmTime % 60;

            document.getElementById("tmDisplay").innerText =
                String(h).padStart(2, '0') + ":" +
                String(m).padStart(2, '0') + ":" +
                String(s).padStart(2, '0');
        }

        function updateTimer() {
            let h = parseInt(document.getElementById("hour").value) || 0;
            let m = parseInt(document.getElementById("min").value) || 0;
            let s = parseInt(document.getElementById("sec").value) || 0;

            tmTime = h * 3600 + m * 60 + s;
            renderTM();
        }

        function startTM() {
            if (tmTime > 0 && !tmInterval) {
                tmInterval = setInterval(() => {
                    tmTime--;
                    renderTM();

                    if (tmTime <= 0) {
                        clearInterval(tmInterval);
                        tmInterval = null;
                        alert("⏰ Tugadi!");
                    }
                }, 1000);
            }
        }

        function pauseTM() {
            clearInterval(tmInterval);
            tmInterval = null;
        }

        function resetTM() {
            pauseTM();
            tmTime = 0;
            document.getElementById("tmDisplay").innerText = "00:00:00";

            document.getElementById("hour").value = "";
            document.getElementById("min").value = "";
            document.getElementById("sec").value = "";
        }


        /* ========= TAB SWITCH (FIXED) ========= */
        function showSW() {
            document.getElementById("stopwatch").style.display = "block";
            document.getElementById("timer").style.display = "none";

            document.getElementById("swTab").classList.add("active");
            document.getElementById("tmTab").classList.remove("active");
        }

        function showTM() {
            document.getElementById("stopwatch").style.display = "none";
            document.getElementById("timer").style.display = "block";

            document.getElementById("tmTab").classList.add("active");
            document.getElementById("swTab").classList.remove("active");
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 🔝 REAL VAQT -->

    <!-- 📦 BOX -->
    <div class="container">
        <div class="top-clock" id="clock">00:00:00</div>
        <div class="box">

            <!-- TAB -->
            <div class="tabs">
                <button id="swBtn" class="active">Sekundomer</button>
                <button id="tmBtn">Timer</button>
            </div>

            <!-- SEKUNDOMER -->
            <div id="stopwatchBox">
                <div class="time" id="stopwatch">00:00:00</div>
            </div>

            <!-- TIMER -->
            <div id="timerBox" class="hidden">
                <input type="number" id="hours" placeholder="Hours">
                <input type="number" id="minutes" placeholder="Minutes">
                <input type="number" id="seconds" placeholder="Seconds">

                <div class="time" id="timer">00:00:00</div>
            </div>

            <!-- BUTTON -->
            <div class="buttons">
                <button class="start" onclick="start()">Start</button>
                <button class="pause" onclick="pause()">Pause</button>
                <button class="reset" onclick="reset()">Reset</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
